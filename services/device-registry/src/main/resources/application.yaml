server:
  port: 8020

spring:
  application:
    name: device-registry
  # H2 Config properties
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:device_registrydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:./schema.sql
      data-locations: classpath:./data.sql

  jpa:
    hibernate:
      ddl-auto: update

